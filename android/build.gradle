// El bloque `buildscript` con `classpath` desapareció: las versiones de AGP y
// Kotlin ahora viven en `settings.gradle`. Aquí solo quedan los repositorios y
// el traslado del directorio de compilación fuera de `android/`.
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// `rootProject.buildDir` se retiró en Gradle 9; el reemplazo es `layout.buildDirectory`.
def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
