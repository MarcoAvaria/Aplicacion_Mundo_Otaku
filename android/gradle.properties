org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Banderas que la plantilla de Flutter 3.47 agrega para AGP 9.
android.newDsl=false
android.builtInKotlin=false
# `android.enableJetifier` se retiró: servía para traducir las viejas support
# libraries a AndroidX y ya no queda ninguna. Solo alargaba cada compilación.
# La compilación incremental de Kotlin falla cuando el proyecto y la caché de
# pub están en **unidades distintas** de Windows. Las fuentes de los plugins
# (por ejemplo image_picker_android) viven en la caché de pub, en C:, y el
# compilador incremental las guarda como rutas relativas al proyecto; si el
# proyecto está en D:, no existe ruta relativa entre dos unidades y aborta con
# "this and base files have different roots", que se ve como "Could not close
# incremental caches". No tiene que ver con los espacios de la ruta: con el
# mismo commit y la incremental activada, compilar desde C: funciona.
# Desactivarla cuesta algo de tiempo en compilaciones repetidas y no cambia el
# resultado; en CI no se nota, porque allí cada compilación parte de cero.
# Para recuperarla hay dos caminos: poner el proyecto en la misma unidad que la
# caché de pub, o mover la caché con la variable de entorno PUB_CACHE.
kotlin.incremental=false
