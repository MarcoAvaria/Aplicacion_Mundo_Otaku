org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Banderas que la plantilla de Flutter 3.47 agrega para AGP 9.
android.newDsl=false
android.builtInKotlin=false
# `android.enableJetifier` se retiró: servía para traducir las viejas support
# libraries a AndroidX y ya no queda ninguna. Solo alargaba cada compilación.
# La compilación incremental de Kotlin falla al cerrar sus cachés en este
# proyecto ("Could not close incremental caches ... class-fq-name-to-source.tab").
# Con Kotlin 2.4 y Gradle 9 sobre una ruta con espacios (`Escritorio del otro
# disco`) el fallo es reproducible y no depende de limpiar `build/`.
# Desactivarla cuesta algo de tiempo de compilación y no cambia el resultado.
kotlin.incremental=false
