// Flutter 3.47 ya no admite aplicar sus plugins de Gradle con `apply from:`.
// Los plugins se declaran aquí, en el bloque `plugins`, y el módulo `app` solo
// los pide por identificador. Las versiones salen de la plantilla oficial de
// Flutter 3.47.5 (`flutter create`), no de una elección propia.
pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk no está definido en local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.1.0" apply false
    id "org.jetbrains.kotlin.android" version "2.4.0" apply false
}

include ":app"
