plugins {
    id "com.android.application"
    // El plugin de Flutter va después del de Android, no antes.
    id "dev.flutter.flutter-gradle-plugin"
}

// Firma de lanzamiento opcional: si no hay `key.properties` completo, la
// compilación de release se queda sin firmar en vez de fallar. Se conserva tal
// como estaba; solo cambió el archivo alrededor.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def releaseSigningKeys = ['keyAlias', 'keyPassword', 'storeFile', 'storePassword']
def hasReleaseSigning = keystorePropertiesFile.exists() &&
        releaseSigningKeys.every { keystoreProperties.getProperty(it)?.trim() }

android {
    namespace = "com.marcoavaria.aplicacion_mundo_otaku"

    // Explícitos, no heredados de Flutter. Antes eran `flutter.compileSdkVersion`
    // y `flutter.targetSdkVersion`, que con Flutter 3.16.8 valían 33: la
    // aplicación apuntaba a Android 13 y no había forma de cambiarlo desde aquí.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId = "com.marcoavaria.aplicacion_mundo_otaku"
        minSdk = flutter.minSdkVersion
        targetSdk = 36
        multiDexEnabled = true
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = '../..'
}

dependencies {
    // Flutter 3.16 arrastraba androidx.window beta04, incompatible con las
    // extensiones de ventana de Android 14, y por eso quedó fijado en 1.0.0
    // (T-016). Con Flutter 3.47 esa razón puede haber desaparecido: conviene
    // probar a quitar el pin, pero en un cambio propio y comprobándolo en un
    // aparato real, porque el síntoma era un cierre tras la pantalla de inicio.
    implementation 'androidx.window:window:1.0.0'
    implementation 'androidx.window:window-java:1.0.0'
    // La 1.2.2 es de la época de AGP 7; AGP 9 pide la línea 2.x.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
